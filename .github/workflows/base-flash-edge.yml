name: Base Flash Edge Probe

on:
  push:
    branches: [main]
    paths:
      - 'probe.mjs'
      - '.github/workflows/base-flash-edge.yml'
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install probe dependencies
        run: npm install --no-save viem solc
      - name: Run read-only pending-state scan
        id: probe
        continue-on-error: true
        run: node probe.mjs
      - name: Persist result
        if: always()
        run: |
          test -f result.json || echo '{"overallStatus":"NO_RESULT_FILE"}' > result.json
          git config user.name 'base-flash-edge-bot'
          git config user.email 'base-flash-edge-bot@users.noreply.github.com'
          git add result.json
          git commit -m 'Update Base Flash edge result' || true
          git push
      - name: Fail if probe failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
