<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IBO Live Scanner</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#090e15;color:#eef4fa;margin:0;padding:16px}.wrap{max-width:1000px;margin:auto}.card{background:#111925;border:1px solid #26364a;border-radius:16px;padding:16px;margin:12px 0}.ok{color:#5ce391}.bad{color:#ff7d7d}.muted{color:#9eb0c4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.metric{background:#0d141e;border:1px solid #1e2b3b;border-radius:12px;padding:12px}.v{font-size:1.2rem;font-weight:700;margin-top:6px;word-break:break-word}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#172230}button{background:#eef4fa;color:#081019;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:420px;overflow:auto}</style>
</head>
<body><div class="wrap">
<h2>IBO Live Scanner · Base/Aave</h2>
<div class="row"><span class="pill">READ ONLY</span><span class="pill">NO SIGNING</span><span class="pill">NO BROADCAST</span><span class="pill">AUTO CLOUD 2m</span><button id="refreshBtn">Yenile</button></div>
<div id="status" class="card">Cloud proof bekleniyor…</div>
<div class="grid">
 <div class="metric"><div class="muted">Chain ID</div><div id="chain" class="v">-</div></div>
 <div class="metric"><div class="muted">Live block</div><div id="block" class="v">-</div></div>
 <div class="metric"><div class="muted">Scheduled head</div><div id="scanHead" class="v">-</div></div>
 <div class="metric"><div class="muted">State age</div><div id="age" class="v">-</div></div>
 <div class="metric"><div class="muted">Checked</div><div id="checked" class="v">-</div></div>
 <div class="metric"><div class="muted">Borrow logs</div><div id="borrowLogs" class="v">-</div></div>
 <div class="metric"><div class="muted">Liquidatable</div><div id="liq" class="v">-</div></div>
 <div class="metric"><div class="muted">Near HF&lt;1.08</div><div id="near" class="v">-</div></div>
 <div class="metric"><div class="muted">Last auto scan</div><div id="scanAt" class="v">-</div></div>
</div>
<div class="card"><b>Otomatik tarama kanıtı</b><pre id="proof">Henüz kayıt yok.</pre></div>
<div class="card"><b>Health kanıtı</b><pre id="health">-</pre></div>
</div>
<script>
const el=id=>document.getElementById(id);const u={status:el('status'),chain:el('chain'),block:el('block'),scanHead:el('scanHead'),age:el('age'),checked:el('checked'),borrowLogs:el('borrowLogs'),liq:el('liq'),near:el('near'),scanAt:el('scanAt'),proof:el('proof'),health:el('health'),refreshBtn:el('refreshBtn')};
async function j(url){const r=await fetch(url,{cache:'no-store'});const x=await r.json();if(!r.ok)throw new Error(x.error||('HTTP '+r.status));return x}function fmtAt(s){if(!s)return'-';try{return new Date(s).toLocaleString('tr-TR')}catch{return s}}
async function refresh(){u.refreshBtn.disabled=true;try{const h=await j('/api/health');u.chain.textContent=h.chainId??'-';u.block.textContent=(h.blockNumber??0).toLocaleString('tr-TR');u.health.textContent=JSON.stringify(h,null,2);if(!h.ok||h.chainId!==8453)throw new Error('BASE_CHAIN_PROOF_FAILED');let s;try{s=await j('/api/state')}catch(e){u.status.className='card';u.status.textContent='BASE CANLI · scheduled proof henüz bekleniyor';u.proof.textContent=e.message;return}u.scanHead.textContent=(s.scanHead??0).toLocaleString('tr-TR');u.age.textContent=(s.ageSeconds??'-')+' s';u.checked.textContent=s.checked??0;u.borrowLogs.textContent=s.borrowLogCount??0;u.liq.textContent=s.liquidatableCount??0;u.near.textContent=s.nearCount??0;u.scanAt.textContent=fmtAt(s.scanObservedAt||s.startedAt);u.proof.textContent=JSON.stringify(s,null,2);u.status.className='card '+(s.ok&&!s.stale?'ok':'bad');u.status.textContent=s.ok&&!s.stale?'OTONOM CANLI · scheduled Base/Aave cycle doğrulandı':('OTONOM STATE HATASI · '+(s.error||'STALE'));}catch(e){u.status.className='card bad';u.status.textContent='BACKEND HATASI · '+e.message}finally{u.refreshBtn.disabled=false}}
u.refreshBtn.onclick=refresh;refresh();setInterval(refresh,30000);
</script></body></html>
