<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IBO Live Scanner</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#090e15;color:#eef4fa;margin:0;padding:16px}.wrap{max-width:1000px;margin:auto}.card{background:#111925;border:1px solid #26364a;border-radius:16px;padding:16px;margin:12px 0}.ok{color:#5ce391}.bad{color:#ff7d7d}.muted{color:#9eb0c4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.metric{background:#0d141e;border:1px solid #1e2b3b;border-radius:12px;padding:12px}.v{font-size:1.25rem;font-weight:700;margin-top:6px;word-break:break-word}button{background:#eef4fa;color:#081019;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#172230}.warn{color:#ffd479}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:420px;overflow:auto}</style>
</head>
<body><div class="wrap">
<h2>IBO Live Scanner · Base/Aave</h2>
<div class="row"><span class="pill">READ ONLY</span><span class="pill">NO SIGNING</span><span class="pill">NO BROADCAST</span><span class="pill">AUTO UI 30s</span><span class="pill">CLOUD 2m</span><button id="refreshBtn">Şimdi yenile</button></div>
<div id="status" class="card">Otomatik cloud taraması aktif…</div>
<div class="grid">
 <div class="metric"><div class="muted">Chain ID</div><div id="chain" class="v">-</div></div>
 <div class="metric"><div class="muted">Block</div><div id="block" class="v">-</div></div>
 <div class="metric"><div class="muted">Gas (wei)</div><div id="gas" class="v">-</div></div>
 <div class="metric"><div class="muted">RPC max latency</div><div id="lat" class="v">-</div></div>
 <div class="metric"><div class="muted">Checked</div><div id="checked" class="v">-</div></div>
 <div class="metric"><div class="muted">Borrow logs</div><div id="borrowLogs" class="v">-</div></div>
 <div class="metric"><div class="muted">Liquidatable</div><div id="liq" class="v">-</div></div>
 <div class="metric"><div class="muted">Near HF&lt;1.08</div><div id="near" class="v">-</div></div>
 <div class="metric"><div class="muted">Last scan</div><div id="scanAt" class="v">-</div></div>
</div>
<div class="card"><b>Fırsatlar</b><pre id="opp">Cloud taraması başlatılıyor…</pre></div>
<div class="card"><b>Health kanıtı</b><pre id="health">-</pre></div>
</div>
<script>
const el=id=>document.getElementById(id);
const ui={status:el('status'),chain:el('chain'),block:el('block'),gas:el('gas'),lat:el('lat'),checked:el('checked'),borrowLogs:el('borrowLogs'),liq:el('liq'),near:el('near'),scanAt:el('scanAt'),opp:el('opp'),health:el('health'),refreshBtn:el('refreshBtn')};
let busy=false;
async function j(url){const r=await fetch(url,{cache:'no-store'});const x=await r.json();if(!r.ok)throw new Error(x.error||('HTTP '+r.status));return x}
function fmtAt(s){if(!s)return'-';try{return new Date(s).toLocaleString('tr-TR')}catch{return s}}
async function cycle(){
 if(busy)return;
 busy=true;ui.refreshBtn.disabled=true;
 ui.status.className='card';ui.status.textContent='Cloud backend Base + Aave otomatik doğrulanıyor…';
 try{
   const h=await j('/api/health');
   ui.chain.textContent=h.chainId??'-';ui.block.textContent=(h.blockNumber??0).toLocaleString('tr-TR');ui.gas.textContent=h.gasPriceWei??'-';ui.lat.textContent=Math.max(...Object.values(h.rpcLatencyMs||{x:0}))+' ms';ui.health.textContent=JSON.stringify(h,null,2);
   if(!h.ok||h.chainId!==8453)throw new Error('BASE_CHAIN_PROOF_FAILED');
   const o=await j('/api/opportunities');
   ui.checked.textContent=o.checked??0;ui.borrowLogs.textContent=o.borrowLogCount??'-';ui.liq.textContent=(o.liquidatable||[]).length;ui.near.textContent=(o.near||[]).length;ui.scanAt.textContent=fmtAt(o.observedAt);
   ui.opp.textContent=JSON.stringify({head:o.head,observedAt:o.observedAt,checked:o.checked,borrowLogCount:o.borrowLogCount,uniqueBorrowers:o.uniqueBorrowers,liquidatable:o.liquidatable,near:o.near,lowest:o.lowest},null,2);
   ui.status.className='card ok';ui.status.textContent='OTONOM CANLI · BASE 8453 DOĞRULANDI · AAVE TARAMASI ÇALIŞIYOR';
 }catch(e){ui.status.className='card bad';ui.status.textContent='OTONOM CYCLE HATASI · '+e.message;ui.opp.textContent='HATA: '+e.message}
 finally{busy=false;ui.refreshBtn.disabled=false}
}
ui.refreshBtn.onclick=cycle;
cycle();setInterval(cycle,30000);
</script></body></html>
